services:
  txbuilder-tron:
    container_name: txbuilder-tron
    image: ghcr.io/koku-web3/txbuilder-tron:${IMAGE_TAG:-latest}
    ports:
      - "51051:51051"
    volumes:
      - ./config/config.prod.toml:/app/config/config.prod.toml:ro
    restart: unless-stopped
    networks:
      - koku-net

networks:
  koku-net:
    external: true
